name: Build and Push Container

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [gromacs]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest -f docker/${{ matrix.app }}_Dockerfile .

      - name: Push image
        run: |
          image=ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          for attempt in 1 2 3; do
            if docker push "$image"; then exit 0; fi
            echo "Push attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1