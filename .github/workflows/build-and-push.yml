name: Build and Push Container

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [gromacs]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/absrocks/${{ matrix.app }}:latest -f docker/${{ matrix.app }}_Dockerfile .

      - name: Push image
        run: docker push ghcr.io/absrocks/${{ matrix.app }}:latest